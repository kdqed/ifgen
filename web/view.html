<!DOCTYPE html>
<html>
  <head>
    <title>IS Viewer</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="shortcut icon" type="image/png" href="https://kdqed.com/assets/brand/favicon.ico">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main x-data="story">
      <template x-if="loaded">
        <section x-show="currentNode==0">
          <hgroup>
            <h1 x-text="story.title.text_l1"></h1>
            <p x-text="story.title.text_l2" class="em"></p>
            <button x-on:click="changeNodeTo(1)">
              Start
            </button>
          </hgroup>
        </section>
        
      </template>
      <template x-if="loaded" x-for="(node, i) in story.nodes">
        <section x-show="currentNode==node.id">
          <header>
            <button x-on:click="reset()" class="small">Reset</button>
          </header>
          <hgroup>
            <h2 x-text="node.title.text_l1"></h2>
            <p x-text="node.title.text_l2" class="em"><p>
          </hgroup>
          <div>
            <template x-for="text in node.texts">
              <details>
                <summary x-text="text.text_l1"></summary>
                <p x-text="text.text_l2"></p>
              </details>
            </template>
            <template x-for="(action, i) in node.actions">
              <button 
                x-text="action.action_text.text_l1"
                >
              </button>
            </template>
          </div>
          <form class="action-form" 
            x-show="node.actions.length>0"
            x-on:submit.prevent="takeAction(event, node.actions)">
            <input type="text" name="player-action" placeholder="Type Action Here..." autocomplete="off" required>
            <button>-&gt</button>
          </form>
        </section>
        
      </template>
      <template x-if="!loaded">
        <p>Loading...</p>
      </template>
      
    </main>
    <div id="flash"></div>
  </body>
  <script>
    document.addEventListener('alpine:init', async () => {
      Alpine.data('story', () => ({
        loaded: false,
        storyId: null,
        story: {nodes: []},
        currentNode: 0, 

        async init() {
          const params = new URLSearchParams(location.search);
          const storyId = params.get('story');
          const req = await fetch(`/stories/${storyId}.json`);
          const story = await req.json();
          
          this.storyId = storyId;
          this.loaded = true;
          this.story = story;
          const savedNode = localStorage.getItem(this.storyId)
          if(savedNode) {
            this.currentNode = parseInt(savedNode);
          }
          console.log(story);
        },

        async takeAction(event, actions) {
          const userInput = event.target.querySelector('input').value;
          for(let i=0; i<actions.length; i++) {
            if(actionEquals(userInput, actions[i].action_text.text_l1)) {
              this.changeNodeTo(actions[i].destination_id);
              event.target.querySelector('input').value = '';
              return;
            }
          }
          alert('Invalid action');
        },

        changeNodeTo(nodeId) {
          this.currentNode = nodeId;
          localStorage.setItem(this.storyId, nodeId);
          window.flash();    
        },

        reset() {
          const confirmation = window.confirm('Are you sure? Click Ok to go back to the start of the story');
          if(confirmation) {
            this.changeNodeTo(0);
          }
        },
      }));

      
    });

    function actionEquals(t1, t2) {
      const ct1 = t1.trim().replace(/\./g, '').toLowerCase(); //.normalize('NFD').replace(/[\u0300-\u036f]/g, "");
      const ct2 = t2.trim().replace(/\./g, '').toLowerCase(); //normalize('NFD').replace(/[\u0300-\u036f]/g, "");
      return ct1==ct2;
    }

    function flash() {
      window.scrollTo(0,0);
      const flashDiv = document.querySelector('#flash');
      flashDiv.classList.add('done');
      setTimeout(() => {flashDiv.classList.remove('done');}, 1000);
    }
  </script>
</html>
