<!DOCTYPE html>
<html>
  <head>
    <title>IS Viewer</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="shortcut icon" type="image/png" href="https://kdqed.com/assets/brand/favicon.ico">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main x-data="story">
      <template x-if="loaded">
        <section x-show="currentNode==0">
          <hgroup>
            <h1 x-text="story.title.text_l1"></h1>
            <p x-text="story.title.text_l2" class="em"></p>
            <button x-on:click="currentNode = 1">
              Start
            </button>
          </hgroup>
        </section>
        
      </template>
      <template x-if="loaded" x-for="(node, i) in story.nodes">
        <section x-show="currentNode==node.id">
          <hgroup>
            <h2 x-text="node.title.text_l1"></h2>
            <p x-text="node.title.text_l2" class="em"><p>
          </hgroup>
          <div>
            <p>
              <template x-for="text in node.texts">
                <span x-text="text.text_l1 + ' '"></span>
              </template>
            </p>
            <template x-for="(action, i) in node.actions">
              <button 
                x-text="action.action_text.text_l1"
                >
              </button>
            </template>
          </div>
          <details>
            <summary>Show Translation</summary>
            <div>
              <template x-for="text in node.texts">
                <p>
                  <span x-text="text.text_l1"></span>
                  <br>
                  <span x-text="text.text_l2" class="em"></span>
                </p>
              </template>
              <template x-for="(action, i) in node.actions">
                <button>
                  <span x-text="action.action_text.text_l1"></span><br>
                  (<span x-text="action.action_text.text_l2" class="em"></span>)
                </button>
              </template>
            </div>
          </details>
          <form class="action-form" 
            x-show="node.actions.length>0"
            x-on:submit.prevent="takeAction(event, node.actions)">
            <input type="text" name="player-action" placeholder="Type Action Here..." autocomplete="off" required>
            <button>-&gt</button>
          </form>
        </section>
        
      </template>
      <template x-if="!loaded">
        <p>Loading...</p>
      </template>
      
    </main>
    <div id="flash"></div>
  </body>
  <script>
    document.addEventListener('alpine:init', async () => {
      Alpine.data('story', () => ({
        loaded: false,
        story: {nodes: []},
        currentNode: 2, 

        async init() {
          const params = new URLSearchParams(location.search);
          const storyId = params.get('story');
          const req = await fetch(`https://raw.githubusercontent.com/kdqed/ifgen/refs/heads/main/outputs/${storyId}.json`);
          const story = await req.json();
          this.loaded = true;
          this.story = story;
          console.log(story);
        },

        async takeAction(event, actions) {
          const userInput = event.target.querySelector('input').value;
          for(let i=0; i<actions.length; i++) {
            if(actionEquals(userInput, actions[i].action_text.text_l1)) {
              this.currentNode = actions[i].destination_id;
              event.target.querySelector('input').value = '';
              window.scrollTo(0,0);
              const flash = document.querySelector('#flash');
              flash.classList.add('done');
              setTimeout(() => {flash.classList.remove('done');}, 500)
              return;
            }
          }
          alert('Invalid action');
        }
      }));
      
    });

    function actionEquals(t1, t2) {
      //const ct1 = t1.normalize('NFD').replace(/[\u0300-\u036f]/g, "");
      //const ct2 = t2.normalize('NFD').replace(/[\u0300-\u036f]/g, "");
      return t1.trim().toLowerCase()==t2.trim().toLowerCase();
    }
  </script>
</html>
